
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Form</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background-image: url("yang8.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .login-box {
            width: 100%;
            max-width: 350px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;

            text-align: center;
            color: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .login-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
            border: 2px solid white;
        }

        h1 {
            margin: 0 0 25px;
            font-size: 24px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 13px;

            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;

            color: white;
            outline: none;
            font-size: 16px;
        }

        input::placeholder {
            color: white;
            opacity: 0.85;
        }

        input:focus {
            border-color: white;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.6);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;

            background: white;
            color: black;
            border: none;
            border-radius: 8px;

            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .error-message {
            color: #ffcccc;
            font-size: 14px;
        }

        /* Tablet and mobile screens */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .login-box {
                max-width: 100%;
                padding: 25px 20px;
            }

            .login-logo {
                width: 70px;
                height: 70px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <img src="ria.jpg"
             alt="Logo"
             class="login-logo">

        <h1>Please Login</h1>

        <form id="loginForm">

            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter Username"
                    autocomplete="username"
                    required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit">Log In</button>

            <p id="error-message"
               class="error-message"
               role="alert"></p>

        </form>

    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                const username =
                    document.getElementById("username").value;

                const password =
                    document.getElementById("password").value;

                if (username.trim() !== "" &&
                    password.trim() !== "") {
                    window.location.href = "index.html";
                }
            });
    </script>

</body>
</html>
