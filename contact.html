<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | K-Fashion</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            color: black;
            background:
                linear-gradient(
                    rgba(255, 182, 193, 0.45),
                    rgba(255, 105, 180, 0.35)
                ),
                url("yan7.jpg") center / cover fixed no-repeat;
        }

        /* Navigation */
        nav {
            background: #ffb6c1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 15px;
        }

        nav a {
            display: inline-block;
            color: black;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 8px;
            transition: 0.3s;
        }

        nav a:hover {
            background: #ff69b4;
            color: white;
            transform: translateY(-2px);
        }

        /* Contact Form */
        .contact-container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            padding: 35px;
            background: rgba(255, 255, 255, 0.88);
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .contact-container h2 {
            text-align: center;
            color: #d63384;
            margin-bottom: 25px;
            font-size: 32px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input,
        textarea {
            display: block;
            width: 100%;
            padding: 13px;
            border: 1px solid #f3a6c8;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
            background: white;
        }

        input:focus,
        textarea:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 5px rgba(255, 105, 180, 0.4);
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        /* Buttons */
        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 25px;
        }

        button,
        .logout-btn {
            display: inline-block;
            padding: 13px 25px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #ff69b4, #bfefff);
            color: black;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover,
        .logout-btn:hover {
            transform: scale(1.05);
            background: #ff69b4;
            color: white;
        }

        .logout-btn {
            background: #555;
            color: white;
        }

        /* Footer */
        footer {
            background: #ffb6c1;
            text-align: center;
            padding: 18px;
            margin-top: 40px;
        }

        /* Tablet and Mobile */
        @media screen and (max-width: 768px) {
            nav {
                gap: 8px;
                padding: 12px;
            }

            nav a {
                padding: 10px 15px;
                font-size: 14px;
            }

            .contact-container {
                width: 92%;
                margin: 30px auto;
                padding: 25px;
            }

            .contact-container h2 {
                font-size: 27px;
            }
        }

        @media screen and (max-width: 480px) {
            nav {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }

            nav a {
                text-align: center;
                padding: 12px 5px;
                font-size: 14px;
            }

            .contact-container {
                width: 92%;
                padding: 20px 16px;
                margin: 25px auto;
            }

            .contact-container h2 {
                font-size: 24px;
                margin-bottom: 20px;
            }

            input,
            textarea {
                font-size: 16px;
                padding: 12px;
            }

            .button-group {
                flex-direction: column;
            }

            button,
            .logout-btn {
                width: 100%;
                padding: 13px;
            }

            footer {
                font-size: 13px;
                padding: 15px 8px;
            }

            body {
                background-attachment: scroll;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="Product.html">Product</a>
    </nav>

    <main class="contact-container">
        <h2>Contact Us</h2>

        <form onsubmit="sendMessage(event)">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                placeholder="Write your message..."
                required
            ></textarea>

            <div class="button-group">
                <button type="submit">Send Message</button>

                <a class="logout-btn" href="Homepage.html"
                   onclick="return confirm('Are you sure you want to log out?');">
                    Log Out
                </a>
            </div>

        </form>
    </main>

    <footer>
        <p>Miss. RIALYN KIM | SHOP K-FASHION</p>
    </footer>

    <script>
        function sendMessage(event) {
            event.preventDefault();

            alert("Thank you! Your message has been submitted.");

            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("message").value = "";
        }
    </script>

</body>
</html>
